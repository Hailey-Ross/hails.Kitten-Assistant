[package]
name = "kitten-assistant"
version = "0.1.1"
edition = "2021"
description = "A tiny desktop buddy for Windows: a kitten at a little computer that shows what your background jobs are doing."
license = "MIT"
repository = "https://github.com/Hailey-Ross/hails.Kitten-Assistant"
readme = "README.md"
keywords = ["desktop", "buddy", "status", "windows", "kitten"]
categories = ["gui"]
publish = false

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
